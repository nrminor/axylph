[package]
name = "axylph"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Read streaming for a future sylph profiling service"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"

[profile.dev]
incremental = true
lto = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
