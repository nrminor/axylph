[package]
name = "axylph"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Read streaming for a future sylph profiling service"

[dependencies]
arrow-array = "=60.1.0"
arrow-flight = { version = "=60.1.0", default-features = false }
arrow-ipc = { version = "=60.1.0", default-features = false }
arrow-schema = "=60.1.0"
async-stream = "=0.3.6"
axum = { version = "=0.8.9", default-features = false, features = ["http2", "tokio"] }
clap = { version = "=4.6.7", features = ["derive"] }
color-eyre = { version = "=0.6.5", default-features = false, features = ["track-caller"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
flate2 = "=1.1.11"
seq_io = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sylph = { git = "https://github.com/nrminor/sylph", rev = "1c9ec8658c5566a424a97fda2512b2a332dabf2c", default-features = false, features = ["profile-core"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "io-util"] }
tokio-stream = { version = "=0.1.19", default-features = false }
tonic = { version = "=0.14.9", default-features = false, features = ["transport", "router", "codegen"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"

[profile.dev]
incremental = true
lto = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
